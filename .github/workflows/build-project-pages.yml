name: Build and deploy Paglora Docs from source

on:
  push:
    branches: [main]
    paths:
      - "project/**"
      - ".github/workflows/build-project-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build without Studio and deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out documentation source
        uses: actions/checkout@v7
      - name: Check out Paglora headless source builder
        uses: actions/checkout@v7
        with:
          repository: m1nsook/paglora
          ref: main
          path: .paglora-builder
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install Linux Tauri Rust build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .paglora-builder/apps/desktop/src-tauri
      - name: Install locked site runtime and isolated Markdown parser
        working-directory: .paglora-builder
        run: |
          bun install --frozen-lockfile
          npm install --prefix tools/headless --no-audit --no-fund --package-lock=false --ignore-scripts
          bun packages/site-runtime/build.mjs
      - name: Validate official project source
        run: |
          node scripts/check-docs-source.mjs
          npm exec --yes --package=paglora@0.0.1-alpha.3 -- paglora validate ./project/paglora-docs
      - name: Prepare public pages without starting Desktop
        working-directory: .paglora-builder
        run: |
          node tools/headless/render.mjs "$GITHUB_WORKSPACE/project/paglora-docs" "$RUNNER_TEMP/paglora-rendered.json"
      - name: Build site with same Rust renderer as Desktop
        working-directory: .paglora-builder
        run: |
          cargo run --locked --release --manifest-path apps/desktop/src-tauri/Cargo.toml --bin paglora-build -- \
            "$GITHUB_WORKSPACE/project/paglora-docs" "$RUNNER_TEMP/paglora-site" "$RUNNER_TEMP/paglora-rendered.json"
      - name: Verify generated HTML and public-only export
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css paglora.js paglora-search.js search-index.json translations.html; do
            test -f "$RUNNER_TEMP/paglora-site/$file" || { echo "::error::Missing $file"; exit 1; }
          done
          test -d "$RUNNER_TEMP/paglora-site/_paglora/chunks" || { echo "::error::Missing _paglora runtime bundle directory"; exit 1; }
          js_chunks="$(find "$RUNNER_TEMP/paglora-site/_paglora/chunks" -maxdepth 1 -type f -name '*.js' | wc -l)"
          css_chunks="$(find "$RUNNER_TEMP/paglora-site/_paglora/chunks/css" -maxdepth 1 -type f -name '*.css' | wc -l)"
          test "$js_chunks" -ge 2 && test "$css_chunks" -ge 1 || { echo "::error::Missing hashed JS/CSS chunks"; exit 1; }
          grep -q '_paglora/chunks/' "$RUNNER_TEMP/paglora-site/index.html" || { echo "::error::Export HTML does not reference content chunks"; exit 1; }
          grep -q 'rel="icon"' "$RUNNER_TEMP/paglora-site/index.html" || { echo "::error::Docs favicon is missing from export"; exit 1; }
          test -f "$RUNNER_TEMP/paglora-site/pages/index.html" || { echo "::error::Missing compact pages/index.html"; exit 1; }
          grep -q 'name="robots" content="noindex,follow"' "$RUNNER_TEMP/paglora-site/pages/index.html" || { echo "::error::Page mirror must not compete with canonical root URL"; exit 1; }
          if find "$RUNNER_TEMP/paglora-site" -type f -name '*.md' -print -quit | grep -q .; then
            echo "::error::Raw Markdown source was included in public website"; exit 1;
          fi
          if grep -iE 'official site is still private|github pages has not been deployed' "$RUNNER_TEMP/paglora-site/index.html"; then
            echo "::error::Old documentation project was used"; exit 1;
          fi
      - uses: actions/configure-pages@v5
      - name: Upload generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/paglora-site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
